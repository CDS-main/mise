<style>
:root{
  --bg:#FAF7F1;--panel:#FFFFFF;--panel-2:#F1ECE3;--panel-3:#E7E0D3;
  --line:#E2DCD0;--line-2:#CFC7B7;--fg:#1A1713;--fg-2:#5F584D;--fg-3:#918876;
  --amber:#B67514;--amber-bg:#FBF0DC;--green:#2F7A52;--green-bg:#E2F0E7;
  --red:#B44334;--red-bg:#FAE6E2;--blue:#2A6076;--blue-bg:#E2EFF4;
  --c1:#B67514;--c2:#2E5FC0;--c3:#A8437E;--grid:#EDE7DC;
  --sh:0 1px 2px rgba(26,23,19,.05),0 12px 28px -20px rgba(26,23,19,.3);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141210;--panel:#1E1B17;--panel-2:#272320;--panel-3:#332E28;
    --line:#332E28;--line-2:#474038;--fg:#F3EFE8;--fg-2:#A79E90;--fg-3:#786F62;
    --amber:#E8A33D;--amber-bg:#332711;--green:#5CC98E;--green-bg:#13291D;
    --red:#E87562;--red-bg:#331915;--blue:#6FB6CE;--blue-bg:#122831;
    --c1:#B8842B;--c2:#5480D0;--c3:#B86395;--grid:#2B2622;
    --sh:0 1px 2px rgba(0,0,0,.5),0 12px 28px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#141210;--panel:#1E1B17;--panel-2:#272320;--panel-3:#332E28;
  --line:#332E28;--line-2:#474038;--fg:#F3EFE8;--fg-2:#A79E90;--fg-3:#786F62;
  --amber:#E8A33D;--amber-bg:#332711;--green:#5CC98E;--green-bg:#13291D;
  --red:#E87562;--red-bg:#331915;--blue:#6FB6CE;--blue-bg:#122831;
  --c1:#B8842B;--c2:#5480D0;--c3:#B86395;--grid:#2B2622;
  --sh:0 1px 2px rgba(0,0,0,.5),0 12px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Archivo,system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Archivo,sans-serif;margin:0;line-height:1.12;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:5px}
input,select,textarea{background:var(--panel-2);border:1px solid var(--line-2);border-radius:7px;padding:8px 10px}
textarea{width:100%;min-height:130px;font-size:.86rem;line-height:1.55;resize:vertical}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.app{max-width:860px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
  background:var(--panel);position:sticky;top:0;z-index:30}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.brand span{color:var(--amber)}
.bell{margin-left:auto;position:relative}
.bell>button{font-size:.7rem;font-family:"JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber);font-weight:600}
.bellpop{display:none;position:absolute;right:0;top:32px;width:264px;background:var(--panel);border:1px solid var(--line-2);
  border-radius:9px;box-shadow:var(--sh);padding:12px;z-index:40}
.bell:hover .bellpop,.bell:focus-within .bellpop{display:block}
nav{display:flex;gap:2px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:55px;z-index:29;overflow-x:auto}
nav button{padding:8px 13px;border-radius:999px;font-size:.83rem;font-weight:600;color:var(--fg-2);white-space:nowrap}
nav button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
main{padding:22px 18px 100px;flex:1}
.view{display:none;flex-direction:column;gap:20px}.view.on{display:flex}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.sub{color:var(--fg-2);font-size:.92rem}
.note{font-size:.79rem;color:var(--fg-3)}
.warn-t{color:var(--amber);font-weight:500}
#assist .why{white-space:pre-wrap}
#assist input{font-size:.86rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.pad{padding:17px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:13px}
.col-sm{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:.81rem;font-weight:500;
  color:var(--fg-2);background:var(--panel)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{padding:11px 18px;border-radius:9px;font-weight:600;font-size:.92rem;background:var(--fg);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.amber{background:var(--amber);color:#14120F}
.btn.wide{width:100%;text-align:center}
.btn.sm{padding:6px 11px;font-size:.79rem;border-radius:7px}
.reels{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.reel{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.reel-cap{display:flex;align-items:center;justify-content:space-between;padding:7px 9px 2px;gap:4px}
.reel-cap b{font-family:"JetBrains Mono",monospace;font-size:.56rem;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3);font-weight:400}
.pin{font-size:.54rem;font-family:"JetBrains Mono",monospace;letter-spacing:.07em;text-transform:uppercase;
  padding:2px 5px;border-radius:4px;color:var(--fg-3);border:1px solid transparent}
.pin[aria-pressed="true"]{color:var(--amber);background:var(--amber-bg);border-color:var(--amber)}
.win{height:46px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 28%,#000 72%,transparent)}
.strip div{height:46px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 5px;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.86rem;line-height:1.05}
.reel-ctl{display:flex;border-top:1px solid var(--line)}
.reel-ctl button{flex:1;padding:6px;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg-3);font-family:"JetBrains Mono",monospace}
.reel-ctl button:hover{color:var(--fg);background:var(--panel-3)}
.reel-ctl button+button{border-left:1px solid var(--line)}
.reel select{width:100%;border:none;border-radius:0;background:var(--panel-3);font-size:.74rem;padding:6px 8px}
.sug{display:grid;grid-template-columns:5px 1fr;overflow:hidden;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.sug .edge{background:var(--line-2)}
.sug.ready .edge{background:var(--green)}
.sug.hot .edge{background:var(--amber)}
.sug-in{padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:"JetBrains Mono",monospace;font-size:.59rem;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 6px;border-radius:4px;background:var(--panel-2);color:var(--fg-2);font-weight:600}
.tag.a{background:var(--amber-bg);color:var(--amber)}
.tag.g{background:var(--green-bg);color:var(--green)}
.tag.r{background:var(--red-bg);color:var(--red)}
.tag.b{background:var(--blue-bg);color:var(--blue)}
.tag.miss{background:transparent;border:1px dashed var(--line-2);color:var(--fg-3)}
.meter{height:5px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:99px}
.meter i.part{background:var(--amber)}
.why{font-size:.78rem;color:var(--fg-2)}
.peek{display:none;border-top:1px dashed var(--line-2);margin-top:4px;padding-top:11px;gap:9px;flex-direction:column}
.sug:hover .peek,.sug:focus-within .peek,.sug.open .peek{display:flex}
.peekgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:540px){.peekgrid{grid-template-columns:1fr}}
.peek ul{margin:0;padding-left:16px;font-size:.78rem;color:var(--fg-2);line-height:1.55}
.peek li.miss{color:var(--red)}
.stars{color:var(--amber);letter-spacing:1px;font-size:.85rem}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:11px}
.st{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:13px;display:flex;flex-direction:column;gap:8px}
.st.locked{opacity:.5}
.st.running{border-color:var(--amber);background:var(--amber-bg)}
.st.done{border-color:var(--green);opacity:.72}
.st.focus{outline:2px solid var(--fg);outline-offset:-2px}
.st .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.st h3{font-size:.93rem}
.st .mt{font-family:"JetBrains Mono",monospace;font-size:.7rem;color:var(--fg-2)}
.vessel{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:.57rem;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--blue-bg);color:var(--blue);font-weight:600}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:19px;box-shadow:var(--sh)}
.readout{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.04em;
  font-size:clamp(2.8rem,13vw,4.4rem);line-height:.95;font-variant-numeric:tabular-nums}
.readout small{font-size:.28em;font-weight:600;color:var(--fg-3);margin-left:.14em}
.target{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--fg-2)}
.leds{display:flex;gap:3px;height:13px;margin:12px 0}
.leds i{flex:1;background:var(--panel-2);border-radius:2px}
.pourbtn{width:100%;padding:20px;border-radius:11px;background:var(--panel-2);border:1px dashed var(--line-2);
  font-weight:700;color:var(--fg-2);user-select:none;touch-action:none}
.pourbtn.on{background:var(--amber);color:#14120F;border-style:solid;border-color:var(--amber)}
.station{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:.57rem;letter-spacing:.08em;
  text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--panel-3);color:var(--fg-2);font-weight:600}
.tipbox{margin-top:13px;padding:11px 13px;border-radius:9px;background:var(--panel-2);border-left:3px solid var(--blue);
  font-size:.82rem;color:var(--fg-2);min-height:52px;display:flex;align-items:center;gap:9px}
.tipbox b{font-family:"JetBrains Mono",monospace;font-size:.57rem;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);flex:none}
.clock{font-family:"JetBrains Mono",monospace;font-size:1.05rem;font-weight:600;font-variant-numeric:tabular-nums}
.steplist{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.stp{background:var(--panel);padding:10px 13px;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:.86rem}
.stp.now{background:var(--amber-bg)}.stp.done{color:var(--fg-3)}
.stp .n{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--fg-3)}
.stp .g{font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--fg-2)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--fg-3);padding:11px 11px 7px;font-weight:400;white-space:nowrap}
td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:middle}
td.n{font-family:"JetBrains Mono",monospace;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.warn td{background:var(--amber-bg)}tr.bad td{background:var(--red-bg)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.shopitem{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.shopitem:last-child{border-bottom:none}
.shopitem input[type=checkbox]{width:19px;height:19px;accent-color:var(--amber)}
.nl{font-style:italic;color:var(--fg-3);font-size:.82rem}
.chartcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:17px}
.charthead{display:flex;flex-direction:column;gap:3px;margin-bottom:12px}
.charthead h3{font-size:.96rem}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:11px;font-size:.75rem;color:var(--fg-2)}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:11px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;box-shadow:var(--sh)}
.tile .v{font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;font-weight:800;letter-spacing:-.03em;
  line-height:1;font-variant-numeric:tabular-nums;display:block}
.tile .k{font-family:"JetBrains Mono",monospace;font-size:.59rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);margin-top:7px;display:block}
svg{display:block;max-width:100%;overflow:visible}
.gl{stroke:var(--grid);stroke-width:1}
.ax{fill:var(--fg-3);font-family:"JetBrains Mono",monospace;font-size:9.5px}
.dl{fill:var(--fg-2);font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:500}
.hit{fill:transparent;cursor:pointer}
.empty{padding:32px 18px;text-align:center;color:var(--fg-3);font-size:.87rem}
.banner{padding:12px 15px;border-radius:9px;background:var(--amber-bg);border:1px solid var(--amber);
  font-size:.85rem;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.banner.blue{background:var(--blue-bg);border-color:var(--blue)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(150%);background:var(--fg);color:var(--bg);
  padding:12px 20px;border-radius:9px;font-weight:600;font-size:.85rem;z-index:70;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2);box-shadow:var(--sh);max-width:88vw;text-align:center}
.toast.up{transform:translateX(-50%) translateY(0)}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:7px 10px;border-radius:6px;
  font-size:.74rem;font-family:"JetBrains Mono",monospace;z-index:80;opacity:0;transition:opacity .12s;white-space:pre;line-height:1.45}
.tip.on{opacity:1}
.rate{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:7px 0}
.rate input[type=range]{accent-color:var(--amber)}
@media(max-width:540px){main{padding:17px 13px 90px}.tiles{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="bar"><div class="brand">mise<span>.</span></div><div class="bell" id="bell"></div></div>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-v="decide">Decide</button>
    <button role="tab" aria-selected="false" data-v="cook">Cook</button>

  <main>
    <section class="view on" id="v-decide"></section>
    <section class="view" id="v-cook"></section>
    <section class="view" id="v-book"></section>
    <section class="view" id="v-pantry"></section>
    <section class="view" id="v-shop"></section>
    <section class="view" id="v-hub"></section>
  </main>
</div>
<div class="toast" id="toast"></div><div class="tip" id="tip"></div>

function fresh(){
  const p={};
  SEED.forEach(([id,name,nl,cat,tag,cls,q,unit,int,bought,shelf,low,sub,price,pack])=>{
    p[id]={id,name,nl,cat,tag,cls,qty:q,unit,integer:!!int,
      bought:q>0?iso(d(bought)):null,expires:q>0?iso(d(bought+shelf)):null,shelf,low,sub,price,pack}});
  return {pantry:p,log:[],custom:[],hidden:[],extras:[],appliances:APPLIANCES.map(a=>({...a})),kit:{...DEFAULT_KIT},
    reels:{cuisine:"Any",meal:"Any",taste:"Any",theme:"Any"},themeOther:"",
    pins:{cuisine:false,meal:false,taste:false,theme:false},
    effort:"Any",medium:"Any",mode:"auto",intakeMode:"manual",basket:[],intake:[],demo:true};
}
function load(){return (window.MiseAPI&&MiseAPI.cachedState())||null}
function save(){if(window.MiseAPI)MiseAPI.queueSave(S);else try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const RECIPES=()=>[...BUILTIN.filter(r=>!(S.hidden||[]).includes(r.id)),...(S.custom||[])];
const P=id=>S.pantry[id], nm=id=>P(id)?.name||id, nlOf=id=>P(id)?.nl||"";
const un=id=>P(id)?.unit||"g", qty=id=>P(id)?.qty||0, isInt=id=>!!P(id)?.integer;
const allIng=r=>r.stages.flatMap(s=>s.ing);
const rMediums=r=>[...new Set(r.stages.map(s=>s.medium))];
const mediumsAvail=()=>["Any",...new Set(S.appliances.filter(a=>a.have).map(a=>a.medium))];

function rate(id){
  const evs=S.log.flatMap(l=>Object.entries(l.actual||{}).filter(([k])=>k===id).map(([,v])=>({v,date:l.date})));
  if(evs.length>=2){const span=Math.max(1,Math.abs(days(evs[0].date)));
    return {r:evs.reduce((s,e)=>s+e.v,0)/span,n:evs.length,src:"measured"}}
  return {r:BASE_RATE[id]||1,n:evs.length,src:"estimated"};
}
function supply(id){const{r,n,src}=rate(id);return{d:r>0?qty(id)/r:999,r,n,src}}
const surplus=id=>supply(id).d>75&&qty(id)>0;
function urgency(id){const it=P(id);if(!it||!it.expires||it.qty<=0)return 0;
  const n=days(it.expires);return n<0?0:n<=1?1:n<=3?.7:n<=6?.35:0}
function ratingOf(rid){
  const rs=S.log.filter(l=>l.id===rid&&l.rating);
  if(!rs.length)return null;
  const avg=k=>rs.reduce((s,l)=>s+(l.rating[k]||0),0)/rs.length;
  return {taste:avg("taste"),texture:avg("texture"),again:avg("again"),
    overall:(avg("taste")+avg("texture")+avg("again"))/3,n:rs.length};
}
const cookCount=rid=>S.log.filter(l=>l.id===rid).length;
const themeActive=()=>S.reels.theme==="Other…"?(S.themeOther||"").trim():(S.reels.theme==="Any"?"":S.reels.theme);
function matchesQ(r,q){return (q.cuisine==="Any"||r.cuisine===q.cuisine)&&(q.meal==="Any"||r.meal===q.meal)&&
  (q.taste==="Any"||r.taste===q.taste)&&(q.theme==="Any"||q.theme==="Other…"||r.themes.includes(q.theme))}
const countQ=q=>RECIPES().filter(r=>matchesQ(r,q)).length;
function feasVals(k,base){
  const opts=({cuisine:CUISINES,meal:MEALS,taste:TASTES,theme:THEMES})[k];
  return opts.filter(v=>v==="Other…"?false:countQ({...base,[k]:v})>0);
}

function analyse(r){
  let need=0,got=0,missing=[],rescue=[],surp=[],urg=0;
  allIng(r).forEach(i=>{need++;const h=qty(i.id);
    if(h>=i.amt){got++;const u=urgency(i.id);if(u>=.7)rescue.push(i.id);urg+=u;if(surplus(i.id))surp.push(i.id)}

/* ══ IMPORT ═══════════════════════════════════════════════════════════════
 * The link box used to be decorative — it stored what you typed and nothing
 * else. It now posts to /api/import, which walks five tiers: the page's own
 * structured data, a YouTube transcript, the stripped page text, your pasted
 * text, and finally a local regex parser. Tier 1 costs nothing and is exact.
 *
 * Everything the server hands back is a DRAFT. Nothing reaches the recipe book
 * until you press save on the review form.
 * ════════════════════════════════════════════════════════════════════════ */
const serverUp = () => !!(window.MiseAPI && MiseAPI.isOnline());

async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                               body:JSON.stringify(body)});
  const txt = await r.text();
  let j = null; try{ j = JSON.parse(txt) }catch(_){}
  if(!r.ok){
    const e = new Error((j && (j.detail || j.error)) || txt || ("HTTP "+r.status));
    e.status = r.status; throw e;
  }
  return j;
}

/* Local fallback parser. Only used when the server is unreachable — on a
 * laptop with the Pi switched off, the app still does something useful. */
function parseText(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const ing=[],steps=[];
  const re=/^[-*•\d.)\s]*(\d+(?:[.,]\d+)?)\s*(kg|g|gram|grams|ml|l|tbsp|tsp|cups?|ea|x)?\s+(.{2,60})$/i;
  lines.forEach(l=>{
    const m=l.match(re);
    if(m&&l.length<72){
      let amt=parseFloat(m[1].replace(",","."));const u=(m[2]||"").toLowerCase();
      if(u==="kg"||u==="l")amt*=1000;
      if(u==="tbsp")amt*=15;if(u==="tsp")amt*=5;if(u.startsWith("cup"))amt*=240;
      const name=m[3].replace(/^of\s+/i,"").trim();
      ing.push({raw:l,amt:Math.round(amt),unit:"g",name,noun:name.replace(/\s*\([^)]*\)/g,"")
        .replace(/[,;.]?\s*\b(thinly |finely |roughly )?(sliced|diced|chopped|minced|grated|whisked|beaten|peeled|cooked|boneless|skinless|optional)\b\.?/gi,"")
        .replace(/[,;.]\s*$/,"").trim(),id:guessPantry(name)});
    } else if(l.length>25) steps.push(l);
  });
  return {ing,steps};
}
function guessPantry(name){
  const first=name.toLowerCase().split(/\s+/)[0];
  const g=Object.values(S.pantry).find(p=>{
    const pf=p.name.toLowerCase().split(/\s+/);
    return pf.includes(first)||name.toLowerCase().includes(pf[pf.length-1])});
  return g?g.id:"";
}

/* Server draft -> the shape the review form edits. Stages are preserved:
 * the server can return a real parallel structure and flattening it here
 * would throw away the most useful thing it produced. */
function draftFromServer(res){
  const d=res.draft, m=res.matched||[]; let k=0;
  return {
    name:d.name||"", cuisine:d.cuisine||"Other", meal:d.meal||"Dinner",
    taste:d.taste||"Savoury", mins:d.mins||30, servings:d.servings||null,
    notes:d.notes||"", confidence:d.confidence||"medium",
    basis:"", stages:(d.stages||[]).map(st=>({
      name:st.name||"Everything", medium:VESSELS[st.medium]?st.medium:"Bench",
      vessel:st.vessel||"Saucepan", needs:st.needs||[],
      ing:(st.ing||[]).map(g=>{ const mm=m[k++]||{};
        return {raw:g.raw||g.name, name:g.name, noun:mm.noun||g.name,
                amt:Math.round((mm.amt!=null?mm.amt:g.amt)*10)/10,
                unit:mm.unit||g.unit||"g", id:mm.id||"", station:g.station||"prep",
                score:mm.score||0}; }),
      steps:(st.steps||[]).map(x=>typeof x==="string"?x:x.t)
    }))
  };
}
function flatIng(p){ return p.stages.flatMap(st=>st.ing) }

async function runImport(choose){
  const D=DRAFT;
  D.loading=true; D.error=""; renderBook();
  try{
    const body={hint:D.hint||null};
    if(D.text&&D.text.trim()) body.text=D.text; else body.url=D.url;
    if(choose!=null) body.choose=choose;
    const res=await post("/api/import", body);
    D.provenance=res.provenance; D.warnings=res.warnings||[];
    if(!res.draft && (res.candidates||[]).length>1){
      D.candidates=res.candidates; D.parsed=null;      // ask which one
    } else {
      D.candidates=[]; D.parsed=draftFromServer(res);
      const f=flatIng(D.parsed); D.parsed.basis=(f.find(g=>g.id)||{}).id||"";
    }
  }catch(err){
    D.error=String(err.message||err);
    if(D.text&&D.text.trim()){                          // offline: parse locally
      const q=parseText(D.text);
      if(q.ing.length){
        D.provenance="browser-regex";
        D.parsed={name:"",cuisine:"Other",meal:"Dinner",taste:"Savoury",mins:30,notes:"",
          confidence:"low",basis:(q.ing.find(g=>g.id)||{}).id||"",
          stages:[{name:"Everything",medium:"Stove top",vessel:"Saucepan",needs:[],
                   ing:q.ing,steps:q.steps}]};
        D.error+=" — parsed it here in the browser instead.";
      }
    }
  }
  D.loading=false; renderBook();
}

const TIER={"json-ld":"the page's own structured data — no model involved",
  "youtube-transcript":"the video's subtitles, read by the model",
  "page-text":"the page text, read by the model",
  "pasted-text":"your pasted text, read by the model",
  "regex":"the local parser — the model didn't answer",
  "browser-regex":"the browser's own parser — the server was unreachable"};

function renderDraft(){
  const D=DRAFT, editing=!!D.editing;
  $("#v-book").innerHTML=`
   <div class="between"><div class="col-sm"><span class="eyebrow">${editing?"Edit":"Import"}</span>
     <h1>${editing?esc(D.parsed.name||"Edit recipe"):"Add a recipe"}</h1></div>
     <button class="btn ghost sm" id="cancel">Cancel</button></div>
   ${editing?"":`
   <div class="card pad col-sm"><span class="eyebrow">From a link</span>
     <div class="row"><input id="url" placeholder="a recipe page, or a YouTube link" value="${esc(D.url)}" style="flex:1;min-width:220px">
       <button class="btn amber sm" id="go" ${D.loading?"disabled":""}>${D.loading?"Reading…":"Fetch it"}</button></div>
     <input id="hint" placeholder="optional — anything the page won't say. “this is 4 portions”, “two pans”" value="${esc(D.hint||"")}">
     <p class="note">Most recipe sites publish structured data, which is read exactly and for free. YouTube goes through the subtitles. <b>Instagram and Pinterest refuse server fetches</b> — for those, copy the caption and paste it below.</p>
     <button class="btn ghost sm" id="diag" style="align-self:flex-start">Check the model connection</button>
     ${D.diag?`<div class="card pad"><span class="eyebrow">Model connection</span>
       <p class="note mono" style="white-space:pre-wrap;margin-top:6px">${esc(D.diag)}</p></div>`:""}
   </div>
   ${D.error?`<div class="card pad"><p class="note warn-t">${esc(D.error)}</p></div>`:""}
   ${D.candidates.length?candidatePicker(D):""}
   <div class="card pad col-sm"><span class="eyebrow">Or paste the recipe text</span>
     <textarea id="txt" placeholder="500 g bread flour&#10;4 g instant yeast&#10;10 g sea salt&#10;&#10;Mix and rest 30 minutes.&#10;Bake at 220 C for 22 minutes.">${esc(D.text)}</textarea>
     <button class="btn amber sm" id="parse" style="align-self:flex-start" ${D.loading?"disabled":""}>${D.loading?"Reading…":"Read it"}</button></div>`}
   ${D.parsed?draftForm(D.parsed):""}`;

  $("#cancel").onclick=()=>{DRAFT=null;renderBook()};
  if(!editing){
    $("#url").oninput=e=>D.url=e.target.value;
    $("#url").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(D.url.trim())runImport()}};
    $("#hint").oninput=e=>D.hint=e.target.value;
    $("#txt").oninput=e=>D.text=e.target.value;
    $("#go").onclick=()=>{if(!D.url.trim())return toast("Paste a link first");D.text="";runImport()};
    $("#parse").onclick=()=>{if(!D.text.trim())return toast("Nothing pasted yet");runImport()};
    $("#diag").onclick=async()=>{
      D.diag="checking…"; renderBook();
      try{
        const h=await (await fetch("/api/assist/health?probe=1")).json();
        let out=`provider: ${h.provider||"none configured"}\nmodel:    ${h.model||"—"}\n`;
        out+= h.probe? (h.probe.ok?"probe:    OK — the model answered":`probe:    FAILED\n${h.probe.error}`)
                     : "probe:    not run";
        if(h.probe&&!h.probe.ok&&h.probe.status===404){
          const m=await (await fetch("/api/assist/models")).json();
          if(m.ok) out+=`\n\nModels this key can see:\n  ${m.available.slice(0,25).join("\n  ")}`+
            `\n\nPut a working one in .env as MISE_MODEL= and restart.`;
        }
        D.diag=out;
      }catch(e){ D.diag="Couldn't reach the server: "+String(e.message||e); }
      renderBook();
    };
    $$("[data-cand]").forEach(b=>b.onclick=()=>runImport(+b.dataset.cand));
  }
  if(D.parsed)wireDraft();
}

/* ── the review form ──────────────────────────────────────────────────────
 * Everything here is editable and nothing is saved until you say so. Stages
 * are kept separate because that structure is what the cook board reads.  */

     <span class="eyebrow">Review — everything here needs your eye</span>
     <span class="row">${DRAFT.provenance?`<span class="tag a">${esc(TIER[DRAFT.provenance]||DRAFT.provenance)}</span>`:""}
       <span class="tag ${conf}">${p.confidence} confidence</span></span></div>
   ${(DRAFT.warnings||[]).map(w=>`<p class="note warn-t">${esc(w)}</p>`).join("")}
   ${p.notes?`<p class="note">${esc(p.notes)}</p>`:""}
   <div class="row"><input id="dName" placeholder="Recipe name" value="${esc(p.name)}" style="flex:1;min-width:180px">

   <div class="row">
     <select id="dCuisine">${CUISINES.map(c=>`<option ${p.cuisine===c?"selected":""}>${c}</option>`).join("")}</select>
     <select id="dMeal">${MEALS.map(c=>`<option ${p.meal===c?"selected":""}>${c}</option>`).join("")}</select>

     <div class="card pad col-sm" style="margin-top:6px">

         <select data-smedium="${si}">${Object.keys(VESSELS).map(c=>`<option ${st.medium===c?"selected":""}>${c}</option>`).join("")}</select>
         <select data-svessel="${si}">${(VESSELS[st.medium]||ALL_VESSELS()).map(c=>`<option ${st.vessel===c?"selected":""}>${esc(c)}</option>`).join("")}</select>

         ${st.ing.map((g,k)=>`<tr class="${g.id?"":(g.create?"":"warn")}">

function wireDraft(){
  const p=DRAFT.parsed;
  const at=k=>{const [a,b]=k.split(".").map(Number);return p.stages[a].ing[b]};
  $$("[data-amt]").forEach(i=>i.oninput=()=>at(i.dataset.amt).amt=parseFloat(i.value)||0);
  $$("[data-map]").forEach(s=>s.onchange=()=>{
    const g=at(s.dataset.map);
    if(s.value==="__new__"){ g.create=true; g.id=""; }
    else { g.create=false; g.id=s.value; }
    renderBook()});
  $$("[data-basis]").forEach(r=>r.onchange=()=>{p.basis=at(r.dataset.basis).id});
  $$("[data-idel]").forEach(b=>b.onclick=()=>{const[a,k]=b.dataset.idel.split(".").map(Number);
    p.stages[a].ing.splice(k,1);renderBook()});
  $$("[data-sname]").forEach(i=>i.oninput=()=>p.stages[+i.dataset.sname].name=i.value);
  $$("[data-smedium]").forEach(sel=>sel.onchange=()=>{const st=p.stages[+sel.dataset.smedium];
    st.medium=sel.value;st.vessel=(VESSELS[st.medium]||ALL_VESSELS())[0];renderBook()});
  $$("[data-svessel]").forEach(sel=>sel.onchange=()=>p.stages[+sel.dataset.svessel].vessel=sel.value);
  $$("[data-ssteps]").forEach(t=>t.oninput=()=>p.stages[+t.dataset.ssteps].steps=
    t.value.split(/\n/).map(x=>x.trim()).filter(Boolean));
  $$("[data-sdel]").forEach(b=>b.onclick=()=>{p.stages.splice(+b.dataset.sdel,1);renderBook()});
  $("#dAddStage").onclick=()=>{p.stages.push({name:"New stage",medium:"Stove top",
    vessel:"Saucepan",needs:[],ing:[],steps:[]});renderBook()};
  const aa=$("#dAddAll");
  if(aa) aa.onclick=()=>{flatIng(p).forEach(g=>{if(!g.id)g.create=true});renderBook()};
  const bind=(id,key,num)=>{const el=$(id);if(el)el.oninput=el.onchange=()=>p[key]=num?(parseFloat(el.value)||30):el.value};
  bind("#dName","name");bind("#dMins","mins",true);bind("#dCuisine","cuisine");
  bind("#dMeal","meal");bind("#dTaste","taste");
  $("#dSave").onclick=saveDraft;
  const dd=$("#dDelete");
  if(dd) dd.onclick=()=>{const id=DRAFT.editing;DRAFT=null;deleteRecipe(id)};
  wireAssist("draft");
}

function saveDraft(){
  const p=DRAFT.parsed;
  if(!p.name)return toast("Give it a name");

  // Create pantry rows for anything marked "+ add", before the ids are needed.
  let created=0;
  p.stages.forEach(st=>st.ing.forEach(g=>{
    if(g.create && !g.id){
      const shelfName=g.noun||g.name;
      const existing=Object.values(S.pantry).find(x=>x.name.toLowerCase()===shelfName.toLowerCase());
      if(existing){ g.id=existing.id; }
      else { const it=newPantryItem(shelfName,g.unit,g.amt); S.pantry[it.id]=it; g.id=it.id; created++; }
      g.create=false;
    }
  }));

  const stages=p.stages.map((st,i)=>({
    id:"s"+i, name:st.name||("Stage "+(i+1)), medium:st.medium, vessel:st.vessel,
    needs:st.needs||[],
    ing:st.ing.filter(g=>g.id).map(g=>({id:g.id,amt:g.amt,station:g.station||"direct"})),
    steps:(st.steps.length?st.steps:["Cook it."]).map(t=>({t,mins:5}))
  })).filter(st=>st.ing.length||st.steps.length);
  const total=stages.reduce((n,st)=>n+st.ing.length,0);
  if(!total)return toast("Map at least one ingredient to your pantry");
  const basis=p.basis||stages.find(st=>st.ing.length).ing[0].id;
  const rec={id:DRAFT.editing||("cx"+Date.now().toString(36)), name:p.name, cuisine:p.cuisine,
    meal:p.meal, taste:p.taste, mins:p.mins, themes:p.themes||[], basis,
    source:DRAFT.url||DRAFT.source||"pasted", stages};
  S.custom=S.custom||[];
  const at=S.custom.findIndex(r=>r.id===rec.id);
  if(at>=0) S.custom[at]=rec; else S.custom.push(rec);
  if(DRAFT.hideBuiltin){ S.hidden=S.hidden||[]; if(!S.hidden.includes(DRAFT.hideBuiltin)) S.hidden.push(DRAFT.hideBuiltin); }
  save();DRAFT=null;renderBook();
  toast((at>=0?"Updated":"Saved")+(created?` · ${created} new pantry item${created>1?"s":""} at zero`:""));
}

/* Open a saved recipe back into the same form. Editing a built-in saves a copy
 * and hides the original, so the built-ins stay intact underneath. */
function editRecipe(id){
  const r=RECIPES().find(x=>x.id===id); if(!r)return toast("Can't find that one");
  const builtin=!(S.custom||[]).some(x=>x.id===id);
  DRAFT={url:"",text:"",hint:"",candidates:[],warnings:[],provenance:"",chat:[],proposal:null,
    editing:builtin?("cx"+Date.now().toString(36)):r.id, hideBuiltin:builtin?r.id:null,
    source:r.source||"",
    parsed:{name:r.name+(builtin?" (edited)":""),cuisine:r.cuisine,meal:r.meal,taste:r.taste,
      mins:r.mins,themes:r.themes||[],notes:builtin?"A copy of a built-in recipe. The original stays untouched underneath.":"",
      confidence:"high",basis:r.basis,
      stages:r.stages.map(st=>({name:st.name,medium:st.medium,vessel:st.vessel,needs:st.needs||[],
        ing:st.ing.map(g=>({raw:(S.pantry[g.id]||{}).name||g.id,name:(S.pantry[g.id]||{}).name||g.id,
          amt:g.amt,unit:(S.pantry[g.id]||{}).unit||"g",id:g.id,station:g.station||"direct"})),
        steps:st.steps.map(x=>x.t)}))}};
  renderBook();
}

/* An ingredient you don't own is still part of the recipe. Dropping it was the
 * wrong call: the whole Shop tab is built to answer "what am I missing", and it
 * can only answer that if the missing thing exists as a row at zero. So an
 * unmatched ingredient becomes a real pantry item with qty 0, which makes it
 * show up in coverage, in "unlocks N recipes", and on the shopping list. */
function newPantryItem(name, unit, amt){
  const id = "px" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const u  = ["g","ml","ea"].includes(unit) ? unit : (unit==="cup"||unit==="cups"||unit==="tbsp"||unit==="tsp" ? "g" : "ea");
  return {id, name: name.replace(/^\w/, c=>c.toUpperCase()), nl:"", cat:"Other", tag:"",
    cls:"condiment", qty:0, unit:u, integer:u==="ea", bought:null, expires:null,
    shelf:180, low:0, sub:"",
    // a pack size you'd plausibly buy — enough for the recipe, rounded up
    price:0, pack: u==="ea" ? Math.max(1, Math.ceil(amt||1)) : Math.max(100, Math.ceil((amt||100)/50)*50)};
}

/* Deleting. A recipe you imported is yours to destroy; a built-in is hidden
 * instead, because the original lives in the code and pretending to delete it
 * would be a lie. Either way the cook log is left alone — logged cooks are
 * measurements, and you don't delete a measurement because you deleted its
 * recipe. */
function deleteRecipe(id){
  const r=RECIPES().find(x=>x.id===id); if(!r) return;
  const custom=(S.custom||[]).some(x=>x.id===id);
  const cooks=S.log.filter(l=>l.id===id).length;
  const msg=`Delete “${r.name}”?`+
    (cooks?`\n\n${cooks} logged cook${cooks>1?"s":""} will stay in your data — the history is kept, only the recipe goes.`:"")+
    (custom?"":"\n\nThis is a built-in, so it will be hidden rather than destroyed. You can restore it.");
  if(!confirm(msg)) return;
  if(custom) S.custom=S.custom.filter(x=>x.id!==id);
  else { S.hidden=S.hidden||[]; if(!S.hidden.includes(id)) S.hidden.push(id); }
  save(); renderBook(); toast(custom?"Deleted":"Hidden");
}

/* ══ THE ASSISTANT ════════════════════════════════════════════════════════
 * It proposes. You approve. Python applies.
 *
 * The model never gets a write path. It receives a read-only snapshot and
 * returns a change-set that this file renders as a diff. Only your click turns
 * that into real writes, and those go through the same endpoints your own
 * clicks use — so there is one write path in the system, not two.
 *
 * The practical consequence: the worst a confused model can do is waste your
 * time. It cannot quietly change a number you never looked at.
 * ════════════════════════════════════════════════════════════════════════ */
function assistPanel(scope){
  scope = scope || "draft";
  const D = scope==="draft" ? DRAFT : ASSISTS[scope];
  if(!D) return "";
  const busy=D.busy?"disabled":"";
  // Every view is in the DOM at once — they're shown and hidden, not swapped —
  // so these ids must be unique per scope or the handlers all bind to whichever
  // panel happens to come first in the document.
  return `<div class="card pad col-sm" id="assist-${scope}" data-scope="${scope}">
    <span class="eyebrow">Assistant — it proposes, you approve</span>
    ${(D.chat||[]).map(m=>`<div class="${m.role==="user"?"note mono":"why"}" style="padding:2px 0">
      <b>${m.role==="user"?"You":"Mise"}:</b> ${esc(m.content)}</div>`).join("")}
    ${D.proposal?proposalDiff(D.proposal,scope):""}
    <div class="row"><input id="aMsg-${scope}" placeholder="${esc(assistHint(scope))}" style="flex:1;min-width:220px" ${busy}>
      <button class="btn amber sm" id="aSend-${scope}" ${busy}>${D.busy?"Thinking…":"Ask"}</button></div>
    <p class="note">Nothing it suggests is applied until you press <b>Apply</b>. Every change is shown first.</p>
  </div>`;
}
function assistHint(scope){
  return {draft:"“the yeast should be 7 g”, “split the sauce into its own stage”, “this is 4 portions”",
    pantry:"“I used about half the olive oil”, “the yoghurt expires Friday”",
    shop:"“what am I short of for focaccia?”, “add pantry staples I'm low on”",
    ideas:"“something Japanese with what I've got”, “use up the yoghurt”, “quick, one pan, no shop”"}[scope]
    ||"ask for a change";
}

function proposalDiff(pr,scope){
  const rows=[];
  (pr.pantry||[]).forEach(op=>{
    const it=S.pantry[op.id]||{};
    let what="";
    if(op.op==="add") what=`<b>add</b> ${esc(op.name||"?")}${op.qty!=null?` — ${op.qty} ${esc(op.unit||"g")}`:""}`;
    else if(op.op==="set_qty") what=`<b>${esc(it.name||op.id)}</b> — quantity <span class="mono">${it.qty}</span> → <span class="mono">${op.qty}</span>`;
    else if(op.op==="adjust") what=`<b>${esc(it.name||op.id)}</b> — <span class="mono">${op.qty>0?"+":""}${op.qty}</span> (now ${Math.round(((it.qty||0)+(op.qty||0))*10)/10})`;
    else if(op.op==="set_field") what=`<b>${esc(it.name||op.id)}</b> — ${esc(op.field)} <span class="mono">${esc(String(it[op.field]??"—"))}</span> → <span class="mono">${esc(String(op.value))}</span>`;
    else if(op.op==="remove") what=`<b>remove</b> ${esc(it.name||op.id)}`;
    rows.push(`<li>${what}${op.why?` <span class="note">— ${esc(op.why)}</span>`:""}</li>`);
  });
  (pr.shop||[]).forEach(op=>rows.push(
    `<li><b>shopping list</b> — ${esc(op.name)}${op.qty!=null?` (${op.qty} ${esc(op.unit||"")})`:""}${op.why?` <span class="note">— ${esc(op.why)}</span>`:""}</li>`));
  if(pr.draft) rows.push(`<li><b>this recipe</b> — ${draftDelta(pr.draft)}</li>`);

  // Ideas are not a change-set. There is nothing to apply — the point is that
  // you go and fetch a REAL recipe, because a model inventing "340 g" is
  // exactly the thing this system is built not to trust.
  if((pr.ideas||[]).length) return `<div class="card pad col-sm">
    <span class="eyebrow">Ideas — nothing to apply, these are starting points</span>
    <p class="why">${esc(pr.summary||"")}</p>
    <div class="col">${pr.ideas.map(i=>`<div class="sug"><div class="edge"></div><div class="sug-in">
      <div class="between"><h3>${esc(i.name)}</h3>
        <span class="row" style="gap:8px"><span class="tag">${esc(i.cuisine||"Other")}</span>
          <span class="tag">${i.mins||30} min</span></span></div>
      <p class="why">${esc(i.why||"")}</p>
      ${(i.uses||[]).length?`<div class="tags"><span class="note">uses</span>${i.uses.map(u=>`<span class="tag g">${esc(u)}</span>`).join("")}</div>`:""}
      ${(i.missing||[]).length?`<div class="tags"><span class="note">you'd need</span>${i.missing.map(u=>`<span class="tag a">${esc(u)}</span>`).join("")}</div>`:""}
      <div class="row" style="margin-top:8px">
        <a class="btn ghost sm" target="_blank" rel="noopener"
           href="https://duckduckgo.com/?q=${encodeURIComponent((i.search||i.name)+" recipe")}">Find a recipe</a>
        <button class="btn ghost sm" data-ideaimport="${esc(i.search||i.name)}">Import one</button>
        ${(i.missing||[]).length?`<button class="btn ghost sm" data-ideashop="${esc((i.missing||[]).join("|"))}">Add what's missing to the list</button>`:""}
      </div></div></div>`).join("")}</div>
    <p class="note">Deliberately not a recipe. The model is good at "this sounds right and you have most of it"; it is bad at quantities, and an invented 340 g would end up in your logs. Fetch a real one and import it.</p>
    <div class="row"><button class="btn ghost sm" id="aDrop-${scope}">Clear</button></div></div>`;

  if((pr.questions||[]).length && !rows.length)
    return `<div class="card pad col-sm"><span class="eyebrow">It needs to know</span>
      <ul class="note">${pr.questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>`;
  if(!rows.length) return "";
  return `<div class="card pad col-sm"><span class="eyebrow">Proposed — nothing applied yet</span>
    <p class="why">${esc(pr.summary||"")}</p>
    <ul class="note" style="margin:0;padding-left:18px">${rows.join("")}</ul>
    ${(pr.questions||[]).length?`<p class="note warn-t">Also asks: ${pr.questions.map(esc).join(" · ")}</p>`:""}
    <div class="row"><button class="btn amber sm" id="aApply-${scope}">Apply</button>
      <button class="btn ghost sm" id="aDrop-${scope}">Discard</button></div></div>`;
}

/* A field-by-field comparison against what's on screen, so a revised draft is
 * reviewable rather than a wall of JSON you'd rubber-stamp. */
function draftDelta(nd){
  const p=DRAFT&&DRAFT.parsed; if(!p) return "a revised version";
  const bits=[];
  ["name","cuisine","meal","taste","mins"].forEach(k=>{
    if(nd[k]!=null && String(nd[k])!==String(p[k])) bits.push(`${k}: <span class="mono">${esc(String(p[k]))}</span> → <span class="mono">${esc(String(nd[k]))}</span>`);
  });
  const oldI={}; p.stages.forEach(st=>st.ing.forEach(g=>oldI[g.name.toLowerCase()]=g));
  const newI={}; (nd.stages||[]).forEach(st=>(st.ing||[]).forEach(g=>newI[g.name.toLowerCase()]=g));
  Object.keys(newI).forEach(k=>{
    if(!oldI[k]) bits.push(`+ ${esc(newI[k].name)} ${newI[k].amt}${esc(newI[k].unit||"")}`);
    else if(Math.abs(oldI[k].amt-newI[k].amt)>0.001)
      bits.push(`${esc(newI[k].name)}: <span class="mono">${oldI[k].amt}</span> → <span class="mono">${newI[k].amt}${esc(newI[k].unit||"")}</span>`);
  });
  Object.keys(oldI).forEach(k=>{ if(!newI[k]) bits.push(`− ${esc(oldI[k].name)}`) });
  const ns=(nd.stages||[]).length, os=p.stages.length;
  if(ns!==os) bits.push(`stages: <span class="mono">${os}</span> → <span class="mono">${ns}</span>`);
  return bits.length?bits.join("; "):"no visible difference";
}

/* One assistant, four scopes. Each keeps its own conversation, because "use up
 * the yoghurt" on Decide and "the yeast should be 7 g" on a draft are not the
 * same thread and shouldn't share history. */
const ASSISTS={pantry:{chat:[],proposal:null,busy:false},
               shop:{chat:[],proposal:null,busy:false},
               ideas:{chat:[],proposal:null,busy:false}};

function wireAssist(scope){
  scope = scope || "draft";
  const D = scope==="draft" ? DRAFT : ASSISTS[scope];
  if(!D) return;
  const send=$("#aSend-"+scope), box=$("#aMsg-"+scope);
  if(!send||!box) return;
  const ask=async()=>{
    const msg=(box.value||"").trim(); if(!msg) return;
    if(!serverUp()) return toast("The assistant needs the server — the Pi isn't reachable");
    D.chat=D.chat||[]; D.chat.push({role:"user",content:msg});
    D.busy=true; D.proposal=null; box.value=""; rerenderScope(scope);
    try{
      const res=await post("/api/assist/chat",{
        message:msg, scope,
        draft:scope==="draft"?serverShapeDraft(DRAFT.parsed):null,
        history:D.chat.slice(-6).map(m=>({role:m.role,content:m.content}))});
      D.chat.push({role:"assistant",content:res.reply||""});
      D.proposal=res.proposal||null; D.lastMatched=res.matched||[];
    }catch(err){
      D.chat.push({role:"assistant",content:"That didn't work: "+String(err.message||err)});
    }
    D.busy=false; rerenderScope(scope);
  };
  send.onclick=ask;
  box.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();ask()} };
  $$("[data-ideaimport]").forEach(b=>b.onclick=()=>{
    DRAFT=newDraft(); DRAFT.hint=b.dataset.ideaimport;
    go("book");
    toast("Paste the recipe you found, or drop the link in");
  });
  $$("[data-ideashop]").forEach(b=>b.onclick=()=>{
    S.extras=S.extras||[]; let n=0;
    b.dataset.ideashop.split("|").filter(Boolean).forEach(name=>{
      const id=guessPantry(name);
      if(id){ S.basket=S.basket||[]; if(!S.basket.includes(id)){S.basket.push(id);n++} }
      else if(!S.extras.some(x=>x.name.toLowerCase()===name.toLowerCase())){
        S.extras.push({name,qty:null,unit:"",why:"for an idea you liked"});n++}
    });
    save(); renderShop(); toast(n?`Added ${n} to the list`:"Already on the list");
  });
  const ap=$("#aApply-"+scope), dr=$("#aDrop-"+scope);
  if(ap) ap.onclick=()=>applyProposal(D,scope);
  if(dr) dr.onclick=()=>{D.proposal=null;rerenderScope(scope)};
}
function rerenderScope(scope){
  if(scope==="pantry") renderPantry();
  else if(scope==="shop") renderShop();
  else if(scope==="ideas") renderDecide();
  else renderBook();
}

/* Turn the on-screen draft back into the server's shape so the model sees
 * exactly what you see — including edits you made by hand since the import. */
function serverShapeDraft(p){
  return {name:p.name,cuisine:p.cuisine,meal:p.meal,taste:p.taste,mins:p.mins,
    servings:p.servings||null,basis_name:null,confidence:p.confidence||"medium",
    stages:p.stages.map(st=>({name:st.name,medium:st.medium,vessel:st.vessel,needs:st.needs||[],
      ing:st.ing.map(g=>({raw:g.raw||"",name:g.name,amt:g.amt,unit:g.unit||"g",
                          station:g.station||"prep",optional:false})),
      steps:st.steps.map(t=>({t,mins:5}))}))};
}

/* Applying. Note what this does NOT do: it never posts the model's output
 * anywhere. It replays the change-set through adjustQty and save() — the same
 * two paths your own edits use. */
async function applyProposal(D,scope){
  const pr=D.proposal; if(!pr) return;
  let n=0;
  for(const op of (pr.pantry||[])){
    const it=S.pantry[op.id];
    if(op.op==="add"){
      const fresh=newPantryItem(op.name,op.unit||"g",op.qty||0);
      fresh.qty=op.qty||0; if(fresh.qty>0) fresh.bought=iso(today);
      S.pantry[fresh.id]=fresh;n++;
    } else if(!it){ continue;
    } else if(op.op==="set_qty"){ it.qty=op.qty; if(window.MiseAPI)MiseAPI.adjustQty(it.id,null,{absolute:op.qty}); n++;
    } else if(op.op==="adjust"){ it.qty=Math.max(0,Math.round((it.qty+(op.qty||0))*10)/10);
      if(window.MiseAPI)MiseAPI.adjustQty(it.id,op.qty||0); n++;
    } else if(op.op==="set_field"){ it[op.field]=op.value; n++;
    } else if(op.op==="remove"){ delete S.pantry[op.id]; n++; }
  }
  if((pr.shop||[]).length){
    // The basket holds pantry ids, not free text — so match first, and only
    // fall back to a loose note when the thing genuinely isn't a pantry row.
    S.basket=S.basket||[]; S.extras=S.extras||[];
    pr.shop.forEach(o=>{
      const id=guessPantry(o.name);
      if(id){ if(!S.basket.includes(id)){S.basket.push(id);n++} }
      else if(!S.extras.some(x=>x.name.toLowerCase()===o.name.toLowerCase())){
        S.extras.push({name:o.name,qty:o.qty||null,unit:o.unit||"",why:o.why||""});n++}
    });
  }
  if(pr.draft && scope==="draft" && DRAFT){
    const merged=draftFromServer({draft:pr.draft,matched:D.lastMatched||[]});
    merged.basis=DRAFT.parsed.basis||merged.basis;
    flatIng(merged).forEach(g=>{ if(!g.id) g.id=guessPantry(g.name) });
    DRAFT.parsed=merged; n++;
  }
  D.proposal=null; save(); rerenderScope(scope);
  toast(n?`Applied ${n} change${n>1?"s":""}`:"Nothing to apply");
}

function addStock(id,amt){const it=P(id);const n=amt==null?it.pack:amt;
  it.qty=Math.round((it.qty+n)*10)/10;it.bought=iso(today);it.expires=iso(d(it.shelf));save();return n}
function intakeRun(){
  if(!S.intake.length){renderPantry();renderBell();return}
  const id=S.intake[0],it=P(id);
  if(S.intakeMode==="automatic"){
    const n=addStock(id);S.intake=S.intake.slice(1);save();
    toast(`${it.name} +${n}${it.unit} from barcode`);
    if(S.intake.length)setTimeout(intakeRun,420);
    else{renderPantry();renderBell();toast("Intake complete")}
    return}
  const v=prompt(`Scanning ${it.name} (${it.nl}).\n\nNet weight in ${it.unit}? Gross minus packaging tare.\n\n${S.intake.length-1} more after this — cancel to stop.`,it.pack);
  if(v===null){renderPantry();renderBell();return}
  const n=parseFloat(v);if(!isNaN(n))addStock(id,n);
  S.intake=S.intake.slice(1);save();
  if(S.intake.length)setTimeout(intakeRun,120);
  else{renderPantry();renderBell();toast("Intake complete — pantry updated")}
}

function seedHistory(){
  if(S.log.length)return;
  const plan=[["pancakes",-34,"manual",3.1],["cacio",-29,"manual",4.4],["focaccia",-25,"manual",4.7],
    ["pomodoro",-21,"auto",4.2],["shakshuka",-17,"manual",3.8],["congee",-13,"auto",4.6],
    ["pancakes",-9,"auto",4.1],["flatbread",-6,"auto",3.4],["cacio",-3,"auto",4.8]];
  let sd=7;const rnd=()=>{sd=(sd*9301+49297)%233280;return sd/233280};
  plan.forEach(([id,ago,mode,rating],k)=>{
    const r=BUILTIN.find(x=>x.id===id);if(!r)return;
    const drift=mode==="manual"?5.2:2.4,learn=1-k*.055;
    const errors={},actual={},classErr={},byC={};
    allIng(r).forEach(i=>{
      const base=drift*learn*(P(i.id)?.integer?1.9:1)*(1+(rnd()-.5));
      const e=(rnd()<.5?-1:1)*Math.abs(base);
      errors[i.id]=Math.round(e*100)/100;actual[i.id]=Math.round(i.amt*(1+e/100)*10)/10;
      const c=P(i.id)?.cls||"other";(byC[c]=byC[c]||[]).push(Math.abs(e))});
    Object.entries(byC).forEach(([c,v])=>classErr[c]=v.reduce((a,b)=>a+b,0)/v.length);
    const mae=Object.values(errors).reduce((s,e)=>s+Math.abs(e),0)/Object.keys(errors).length;
    S.log.push({id,name:r.name,date:iso(d(ago)),ts:today.getTime()+ago*DAY,mode,factor:1,
      mae:Math.round(mae*100)/100,totalMs:r.mins*60000*(.8+rnd()*.5),
      breakMs:rnd()<.3?rnd()*400000:0,stageMs:{},
      rating:{taste:rating,texture:Math.min(5,Math.max(0,rating+(rnd()-.5))),again:rating,notes:""},
      actual,errors,classErr,subs:{}})});
  save();
}
const tipEl=()=>$("#tip");
function hov(el,text){
  const mv=e=>{const t=tipEl();t.style.left=(e.clientX+13)+"px";t.style.top=(e.clientY-11)+"px"};
  el.addEventListener("pointerenter",e=>{const t=tipEl();t.textContent=text;t.classList.add("on");mv(e)});
  el.addEventListener("pointermove",mv);
  el.addEventListener("pointerleave",()=>tipEl().classList.remove("on"));
}
function barChart(host,data,{unit="%",color="var(--c1)",fmt=v=>v.toFixed(2),colorOf=null}={}){
  if(!host||!data.length)return;
  const W=560,rowH=27,PL=124,PR=62,H=data.length*rowH+22;
  const max=Math.max(...data.map(x=>x.v))*1.15||1,x=v=>PL+(v/max)*(W-PL-PR);
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">
    ${[0,.25,.5,.75,1].map(f=>`<line class="gl" x1="${x(max*f)}" y1="6" x2="${x(max*f)}" y2="${H-16}"/>`).join("")}
    ${data.map((dd,i)=>{const y=8+i*rowH,w=Math.max(x(dd.v)-PL,2);
      return `<g><text class="ax" x="${PL-9}" y="${y+14}" text-anchor="end">${esc(dd.k)}</text>
        <rect x="${PL}" y="${y+4}" width="${w}" height="15" rx="4" fill="${colorOf?colorOf(dd):color}"/>
        <text class="dl" x="${PL+w+7}" y="${y+16}">${fmt(dd.v)}${unit}${dd.flag?" "+dd.flag:""}</text>
        <rect class="hit" x="${PL}" y="${y}" width="${W-PL}" height="${rowH}" data-t="${esc(dd.k)}: ${fmt(dd.v)}${unit}${dd.n?`\n${dd.n} observations`:""}"/></g>`}).join("")}
    ${[0,max].map(v=>`<text class="ax" x="${x(v)}" y="${H-4}" text-anchor="middle">${v.toFixed(1)}</text>`).join("")}</svg>`;
  host.querySelectorAll(".hit").forEach(r=>hov(r,r.dataset.t));
}
function groupChart(host,cats,series){
  if(!host||!cats.length)return;
  const W=560,H=196,PL=44,PB=40,PT=10,PR=10;
  const max=Math.max(...series.flatMap(s=>s.v.filter(v=>v!=null)),1)*1.2;
  const bw=(W-PL-PR)/cats.length,iw=Math.min(20,(bw-14)/series.length),y=v=>PT+(1-v/max)*(H-PT-PB);
  let g="";
  cats.forEach((c,i)=>{series.forEach((s,j)=>{const v=s.v[i];if(v==null)return;
    const x=PL+i*bw+(bw-iw*series.length-2*(series.length-1))/2+j*(iw+2),h=Math.max(H-PB-y(v),2);
    g+=`<rect x="${x}" y="${y(v)}" width="${iw}" height="${h}" rx="4" fill="${s.c}"/>
        <text class="dl" x="${x+iw/2}" y="${y(v)-5}" text-anchor="middle">${v.toFixed(1)}</text>
        <rect class="hit" x="${x}" y="${PT}" width="${iw}" height="${H-PB-PT}" data-t="${esc(s.n)} · ${esc(c)}\n${v.toFixed(2)}% mean abs error"/>`});
    g+=`<text class="ax" x="${PL+i*bw+bw/2}" y="${H-PB+15}" text-anchor="middle">${esc(cats[i])}</text>`});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">
    ${[0,.5,1].map(f=>`<line class="gl" x1="${PL}" y1="${y(max*f)}" x2="${W-PR}" y2="${y(max*f)}"/>
      <text class="ax" x="${PL-7}" y="${y(max*f)+3}" text-anchor="end">${(max*f).toFixed(0)}%</text>`).join("")}${g}</svg>`;
  host.querySelectorAll(".hit").forEach(r=>hov(r,r.dataset.t));
}
function lineChart(host,pts){
  if(!host||pts.length<2)return;
  const W=560,H=190,PL=40,PB=34,PT=14,PR=14;
  const max=Math.max(...pts.map(p=>p.v))*1.3||1;
  const x=i=>PL+(i/(pts.length-1))*(W-PL-PR),y=v=>PT+(1-v/max)*(H-PT-PB);
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.v)}`).join(" ");
  const n=pts.length,sx=pts.reduce((s,_,i)=>s+i,0),sy=pts.reduce((s,p)=>s+p.v,0);
  const sxy=pts.reduce((s,p,i)=>s+i*p.v,0),sxx=pts.reduce((s,_,i)=>s+i*i,0);
  const m=(n*sxy-sx*sy)/(n*sxx-sx*sx||1),b=(sy-m*sx)/n;
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">
    ${[0,.5,1].map(f=>`<line class="gl" x1="${PL}" y1="${y(max*f)}" x2="${W-PR}" y2="${y(max*f)}"/>
      <text class="ax" x="${PL-7}" y="${y(max*f)+3}" text-anchor="end">${(max*f).toFixed(0)}%</text>`).join("")}
    <line x1="${x(0)}" y1="${y(b)}" x2="${x(n-1)}" y2="${y(m*(n-1)+b)}" stroke="var(--fg-3)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="var(--c1)" stroke="var(--panel)" stroke-width="2"/>
      <rect class="hit" x="${x(i)-14}" y="${PT}" width="28" height="${H-PB-PT}" data-t="${esc(p.k)}\n${p.v.toFixed(2)}% · ${esc(p.m)}"/>`).join("")}
    <text class="ax" x="${PL}" y="${H-12}">oldest</text><text class="ax" x="${W-PR}" y="${H-12}" text-anchor="end">newest</text>
    <text class="dl" x="${W-PR}" y="${PT+2}" text-anchor="end">trend ${m<0?"improving":"worsening"} ${Math.abs(m).toFixed(2)}% per cook</text></svg>`;
  host.querySelectorAll(".hit").forEach(r=>hov(r,r.dataset.t));
}
function renderHub(){
  const L=S.log;
  if(!L.length){$("#v-hub").innerHTML=`<div class="card empty">No cooks logged yet.</div>`;return}
  const mae=L.reduce((s,l)=>s+l.mae,0)/L.length,best=Math.min(...L.map(l=>l.mae));
  const activeMs=L.reduce((s,l)=>s+(l.totalMs||0),0);
  const rated=L.filter(l=>l.rating);
  const avgR=rated.length?rated.reduce((s,l)=>s+(l.rating.taste+l.rating.texture+l.rating.again)/3,0)/rated.length:null;
  const cls={};L.forEach(l=>Object.entries(l.classErr||{}).forEach(([k,v])=>(cls[k]=cls[k]||[]).push(v)));
  const clsData=Object.entries(cls).map(([k,v])=>({k:CLASSES[k]||k,v:v.reduce((a,b)=>a+b,0)/v.length,n:v.length})).sort((a,b)=>b.v-a.v);
  const shared=clsData.slice(0,5).map(c=>c.k);
  const series=["manual","auto"].map((m,i)=>({n:m,c:i?"var(--c2)":"var(--c1)",
    v:shared.map(kk=>{const vals=L.filter(l=>l.mode===m).flatMap(l=>Object.entries(l.classErr||{})
      .filter(([k])=>(CLASSES[k]||k)===kk).map(([,v])=>v));
      return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null})}));
  const use={};L.forEach(l=>Object.entries(l.actual||{}).forEach(([k,v])=>use[k]=(use[k]||0)+v));
  const useData=Object.entries(use).map(([k,v])=>({k:nm(k),v})).sort((a,b)=>b.v-a.v).slice(0,9);
  const sup=Object.values(S.pantry).filter(i=>i.qty>0).map(i=>({k:i.name,...supply(i.id)})).sort((a,b)=>a.d-b.d).slice(0,9);
  const rated2=RECIPES().map(r=>({k:r.name,rt:ratingOf(r.id)})).filter(x=>x.rt)
    .map(x=>({k:x.k,v:x.rt.overall,n:x.rt.n})).sort((a,b)=>b.v-a.v);
  $("#v-hub").innerHTML=`
   <div class="col-sm"><span class="eyebrow">Everything the kitchen has recorded</span><h1>Data</h1>
     <p class="sub">${L.length} cooks.${S.demo?" Includes nine seeded historical cooks so the charts have something to say — clear them on the Pantry tab.":""}</p></div>
   <div class="tiles">
     <div class="tile"><span class="v">${L.length}</span><span class="k">Cooks logged</span></div>
     <div class="tile"><span class="v" style="color:${mae<4?"var(--green)":"var(--amber)"}">${mae.toFixed(2)}%</span><span class="k">Mean abs error</span></div>
     <div class="tile"><span class="v" style="color:var(--green)">${best.toFixed(2)}%</span><span class="k">Best cook</span></div>
     <div class="tile"><span class="v">${avgR?avgR.toFixed(1):"—"}</span><span class="k">Avg rating</span></div>
     <div class="tile"><span class="v">${Math.round(activeMs/60000)}m</span><span class="k">Time at the bench</span></div></div>
   <div class="chartcard"><div class="charthead"><h3>Accuracy per cook, oldest to newest</h3>
     <span class="note">Mean absolute error across every weighed ingredient. The dashed line is a least-squares fit — this becomes your learning-curve study.</span></div><div id="ch-trend"></div></div>
   <div class="chartcard"><div class="charthead"><h3>Variance by ingredient class</h3>
     <span class="note">Which kinds of ingredient you measure badly. Small targets with coarse tolerance are always worst.</span></div><div id="ch-class"></div></div>
   <div class="chartcard"><div class="charthead"><h3>Manual entry versus scale-driven</h3>
     <span class="note">The comparison that justifies building the rig. If auto isn't beating manual, the hardware isn't earning its bench space.</span></div>
     <div id="ch-mode"></div><div class="legend">${series.map(s=>`<span><i class="swatch" style="background:${s.c}"></i>${s.n}</span>`).join("")}</div></div>
   ${rated2.length?`<div class="chartcard"><div class="charthead"><h3>How things actually tasted</h3>
     <span class="note">Your own ratings, averaged per recipe out of 5. These push good recipes up the Decide list.</span></div><div id="ch-rate"></div></div>`:""}
   <div class="chartcard"><div class="charthead"><h3>Days of supply remaining</h3>
     <span class="note">Quantity over measured consumption rate. Under 7 days is flagged; estimated rates are marked.</span></div><div id="ch-sup"></div></div>
   <div class="chartcard"><div class="charthead"><h3>Total consumed, all cooks</h3>
     <span class="note">Feeds the reorder-point maths and shows which staples carry your cooking.</span></div><div id="ch-use"></div></div>
   <div class="col-sm"><span class="eyebrow">Every cook</span>
     <div class="tw"><table><thead><tr><th>Recipe</th><th>Date</th><th>Mode</th><th>Theme</th>
       <th style="text-align:right">Rating</th><th style="text-align:right">MAE</th><th style="text-align:right">Time</th><th style="text-align:right">Break</th><th></th></tr></thead><tbody>
     ${[...L].reverse().map(l=>`<tr><td>${esc(l.name)}</td><td class="note mono">${l.date}</td>
       <td><span class="tag ${l.mode==="auto"?"b":""}">${l.mode}</span></td><td class="note">${esc(l.theme||"—")}</td>
       <td class="n">${l.rating?((l.rating.taste+l.rating.texture+l.rating.again)/3).toFixed(1):"—"}</td>
       <td class="n" style="color:${l.mae<3?"var(--green)":l.mae<6?"var(--amber)":"var(--red)"}">${l.mae.toFixed(2)}%</td>
       <td class="n">${fmtT(l.totalMs||0)}</td><td class="n note">${l.breakMs?fmtT(l.breakMs):"—"}</td>
       <td><button class="btn ghost sm" data-again="${l.id}">again</button></td></tr>`).join("")}
     </tbody></table></div></div>
   <button class="btn ghost sm" id="exportLog" style="align-self:flex-start">Copy full log as CSV</button>`;
  lineChart($("#ch-trend"),L.map(l=>({k:l.name+" · "+l.date,v:l.mae,m:l.mode})));

  barChart($("#ch-sup"),sup.map(s=>({k:s.k,v:Math.min(s.d,120),n:s.src==="measured"?s.n:0,

    {unit:"d",fmt:v=>v>=120?"120+":v.toFixed(0),colorOf:x=>x.v<7?"var(--red)":x.v<14?"var(--amber)":"var(--c3)"});
  barChart($("#ch-use"),useData,{unit:"",fmt:v=>v.toFixed(0),color:"var(--c2)"});
  $$("[data-again]").forEach(b=>b.onclick=()=>openBrief(b.dataset.again));
  $("#exportLog").onclick=()=>{
    const rows=[["date","recipe","mode","theme","scale_factor","mae_pct","rating","total_s","break_s"],

        l.rating?((l.rating.taste+l.rating.texture+l.rating.again)/3).toFixed(2):"",
        Math.round((l.totalMs||0)/1000),Math.round((l.breakMs||0)/1000)])];
    navigator.clipboard?.writeText(rows.map(r=>r.join(",")).join("\n"))
      .then(()=>toast("Log CSV copied"),()=>toast("Copy blocked by the browser"))};
}
